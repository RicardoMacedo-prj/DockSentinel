services:
  agent:
    build: .
    image: docksentinel-agent:latest
    container_name: docksentinel-agent
    restart: unless-stopped
    environment:
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
      - REMOVE_VOLUMES=${REMOVE_VOLUMES:-false}
      - INACTIVITY_DAYS=${INACTIVITY_DAYS:-15}
      - RUN_INTERVAL_HOURS=${RUN_INTERVAL_HOURS:-24}
      - IGNORE_CONTAINERS=${IGNORE_CONTAINERS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock